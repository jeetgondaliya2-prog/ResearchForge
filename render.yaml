services:
  - type: web
    name: researchforge-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MOCK_LLM
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./vector_db"
